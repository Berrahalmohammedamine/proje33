<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Font Awesome للأيقونات -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* إعداد الصفحة */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }

      /* النصف الأيمن (صورة الخلفية) */
      .right {
        width: 50%;

        background-size: cover;
        background-position: center;
      }

      /* النصف الأيسر */
      .left {
        width: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f4f4f4;
      }

      /* صندوق تسجيل الدخول */
      .login {
        width: 90%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 90px 40px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      .login h2 {
        font-size: 40px;
        text-align: center;
        margin-bottom: 30px;
        color: #272727;
      }

      /* خانات الإدخال */
      .input-with-icon {
        position: relative;
        margin-bottom: 20px;
      }

      .input-with-icon i {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: #555;
        font-size: 18px;
      }

      .input-with-icon input {
        width: 86%;
        padding: 12px 15px 12px 45px;
        border-radius: 25px;
        border: 1px solid #ccc;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
      }

      .input-with-icon input:focus {
        border-color: rgb(171, 141, 235);
        box-shadow: 0 0 5px rgb(171, 141, 235);
      }

      /* صف التذكّر ونسيان كلمة السر */
      .remember-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0 25px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #333;
      }

      .remember input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: rgb(171, 141, 235);
        cursor: pointer;
      }

      .forgot {
        color: #272727;
        font-size: 14px;
        text-decoration: none;
      }

      .forgot:hover {
        text-decoration: underline;
        color: rgb(111, 83, 172);
      }

      /* الأزرار */
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        color: #fff;
        transition: 0.3s;
        margin-bottom: 15px;
      }

      /* زر تسجيل الدخول العادي */
      .button1 {
        background-color: rgb(141, 116, 197);
      }

      .button1:hover {
        background-color: rgb(171, 141, 235);
      }

      /* زر Google */
      .google-btn {
        background-color: #fff;
        color: #555;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        transition: 0.3s;
      }

      .google-btn img {
        width: 22px;
        height: 22px;
      }

      .google-btn:hover {
        background-color: #f5f5f5;
        border-color: #bbb;
      }

      /* تحسين العرض على الهاتف */
      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }

        .left,
        .right {
          width: 100%;
        }

        .right {
          display: none;
        }

        .login {
          width: 90%;
          margin: 40px auto;
        }
      }

      /* قسم التسجيل الجديد */
      .dont-have {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #333;
      }

      .dont-have p {
        display: inline;
        margin-right: 5px;
        color: #555;
      }

      .signup-link {
        color: rgb(113, 92, 160);
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
      }

      .signup-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="left">
      <form class="login">
        <h2>Sign in</h2>

        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="Email" required />
        </div>

        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>

        <!-- صف التذكّر + نسيان كلمة السر -->
        <div class="remember-row">
          <div class="remember">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="button1">Sign in</button>

        <button type="button" class="google-btn">
          <img
            src="https://www.svgrepo.com/show/355037/google.svg"
            alt="Google logo"
          />
          <span>Sign in with Google</span>
        </button>

        <div class="dont-have">
          <p>Don't have an account?</p>
          <a
            href="#"
            class="signup-link"
            onclick="window.location.href='signup.html'"
            >Sign up</a
          >
        </div>
      </form>
    </div>

    <div class="right">
      <img
        src="../image/chatgpt.png.png"
        alt="background"
        style="width: 100%; height: 100%; object-fit: cover"
      />
    </div>

    <script>
      const form = document.querySelector("form");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = form.email.value;
        const password = form.password.value;

        const response = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          alert(data.message);

          // ✅ توجيه حسب نوع المستخدم
          if (data.category === "provider.html") {
            window.location.href = "provider.html";
          } else if (data.category === "provider") {
            window.location.href = "provider.html";
          }
        } else {
          alert(data.message);
        }
      });
    </script>
  </body>
</html>
