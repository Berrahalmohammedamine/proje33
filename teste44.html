<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détail de la Requête</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      /* --- Réinitialisation et CSS commun --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #f9f8fe;
        color: #333;
      }

      .sidebar {
        width: 250px;
        background-color: #ffffff;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #eee;
      }

      .sidebar-nav {
        list-style: none;
        width: 100%;
      }

      .sidebar-nav li {
        margin-bottom: 20px;
      }

      .sidebar-nav a {
        display: block;
        background-color: #9b86d4;
        color: white;
        padding: 20px;
        text-decoration: none;
        border-radius: 15px;
        text-align: center;
        font-size: 2.2rem;
        transition: background-color 0.3s ease;
      }

      .sidebar-nav a:hover {
        background-color: #7b5aa6;
      }

      .main-content {
        flex-grow: 1;
        padding: 40px;
        overflow-y: auto;
      }

      /* --- CSS Spécifique à CETTE Page (Détails) --- */
      .request-details-container {
        display: grid;
        place-items: center;
        height: 100%;
      }

      .request-card {
        background-color: #e8e4f3;
        padding: 40px 50px;
        border-radius: 20px;
        width: 100%;
        max-width: 650px;
        box-shadow: 0 10px 30px rgba(155, 134, 212, 0.2);
      }

      .request-card .request-title {
        font-size: 2rem;
        color: #4c3a7a;
        border-bottom: 2px solid #9b86d4;
        padding-bottom: 10px;
        display: inline-block;
        margin-bottom: 30px;
      }

      .info-field {
        margin-bottom: 20px;
        font-size: 1.1rem;
      }

      .info-field .label {
        font-weight: 600;
        color: #555;
        display: inline-block;
        width: 150px;
      }

      .info-field .value {
        color: #333;
        font-weight: 500;
      }

      .button-group {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-top: 40px;
      }

      .btn {
        padding: 14px 40px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      .btn-accept {
        background-color: #fff;
        color: #4caf50;
        border-color: #4caf50;
      }
      .btn-accept:hover {
        background-color: #4caf50;
        color: #fff;
      }

      .btn-reject {
        background-color: #fff;
        color: #f44336;
        border-color: #f44336;
      }
      .btn-reject:hover {
        background-color: #f44336;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <ul class="sidebar-nav">
        <li>
          <a href="#"><i class="fa-solid fa-house"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-clock"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-bell"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-gear"></i></a>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <div class="request-details-container">
        <div class="request-card">
          <h2 class="request-title">Request 1</h2>

          <div class="info-field">
            <span class="label">Request ID :</span>
            <span class="value">4815632</span>
          </div>
          <div class="info-field">
            <span class="label">Customer name :</span>
            <span class="value">berrahal mohammed</span>
          </div>
          <div class="info-field">
            <span class="label">Date :</span>
            <span class="value">15/9/2025</span>
          </div>
          <div class="info-field">
            <span class="label">The condition :</span>
            <span class="value">Urgently</span>
          </div>

          <div class="button-group">
            <a href="#" class="btn btn-accept">acceptance</a>
            <a href="#" class="btn btn-reject">to reject</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
