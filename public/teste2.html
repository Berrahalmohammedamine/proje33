<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemple de Sidebar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      /* Réinitialisation de base */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #f4f4f4;
      }

      /* --- Sidebar --- */
      .sidebar {
        width: 260px;
        background-color: #e8e4f3;
        padding: 25px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* --- Profil --- */
      .profile {
        text-align: center;
        margin-bottom: 30px;
      }

      .profile-pic {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        margin-bottom: 10px;
      }

      .profile .email {
        font-size: 0.9rem;
        font-weight: 500;
        color: #333;
        margin-bottom: 5px;
      }

      .profile .email i {
        margin-right: 5px;
        color: #7b5aa6;
      }

      .profile .name {
        font-size: 0.8rem;
        color: #666;
      }

      /* --- Liste de navigation --- */
      .nav-list {
        list-style: none;
        width: 100%;
      }

      .nav-list li {
        margin-bottom: 15px;
      }

      .nav-list a {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #7b5aa6;
        color: white;
        padding: 75px;
        text-decoration: none;
        border-radius: 12px;
        font-size: 1.5rem;
        transition: background-color 0.3s ease;
      }

      .nav-list a:hover {
        background-color: #6a4c93;
      }

      /* --- Contenu principal --- */
      .main-content {
        flex-grow: 1;
        padding: 30px;
        background-color: #ffffff;
        overflow-y: auto;
      }

      /* --- Header du tableau de bord --- */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-info img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }

      /* --- Cards Dashboard --- */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .card {
        background-color: #7b5aa6;
        color: #fff;
        padding: 20px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.2rem;
        margin-bottom: 10px;
      }

      .card .count {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .card .description {
        font-size: 0.9rem;
        color: #ddd;
      }

      /* --- Sections cachées par défaut --- */
      .section {
        display: none;
      }

      .section.active {
        display: block;
      }

      /* --- Top bar des sections --- */
      .top-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .top-bar input,
      .top-bar select {
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        flex: 1;
      }

      .btn {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: #fff;
        background-color: #7b5aa6;
        transition: background-color 0.3s ease;
      }

      .btn:hover {
        background-color: #6a4c93;
      }

      .btn-add {
        background-color: #27ae60;
      }

      .btn-add:hover {
        background-color: #1e8449;
      }

      .btn-delete {
        background-color: #c0392b;
      }

      .btn-delete:hover {
        background-color: #922b21;
      }

      /* --- Modals --- */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <ul class="nav-list">
        <li>
          <a href="#"><i class="fa-solid fa-house"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-clock"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-bell"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-solid fa-gear"></i></a>
        </li>
      </ul>
    </nav>

    <main class="main-content">
      <div class="header">
        <h1 id="pageTitle">Tableau de Bord Vendeur</h1>
        <div class="user-info">
          <img
            id="userProfilePic"
            src="https://via.placeholder.com/150"
            alt="Profile"
          />
          <span id="headerUserName">Vendeur</span>
        </div>
      </div>

      <section id="dashboard" class="section active">
        <div class="cards">
          <div class="card">
            <h3><i class="fa-solid fa-box"></i> Mes Produits</h3>
            <div class="count" id="productsCount">0</div>
            <div class="description">Total de mes produits en vente</div>
          </div>
          <div class="card">
            <h3><i class="fa-solid fa-users"></i> Mes Clients</h3>
            <div class="count" id="clientsCount">0</div>
            <div class="description">Clients ayant acheté mes produits</div>
          </div>
          <div class="card">
            <h3><i class="fa-solid fa-cart-shopping"></i> Mes Commandes</h3>
            <div class="count" id="ordersCount">0</div>
            <div class="description">Commandes de mes produits</div>
          </div>
          <div class="card">
            <h3><i class="fa-solid fa-dollar-sign"></i> Revenus</h3>
            <div class="count" id="revenus">0 DZD</div>
            <div class="description">Chiffre d'affaires total</div>
          </div>
        </div>
      </section>

      <!-- Autres sections comme products, clients, orders, settings restent identiques -->
    </main>
  </body>
</html>
