  <body>
    <!-- مكان الهيدر -->
    <div id="heder">
      
    </div>

    <!-- تحميل الهيدر -->
    <script>
      fetch("heder.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("heder").innerHTML = data;

          // تعريف عناصر البروفايل بعد تحميل الهيدر
          const profileBtn = document.getElementById("profile-btn");
          const profileMenu = document.getElementById("profile-menu");

          if (profileBtn && profileMenu) {
            profileBtn.addEventListener("click", () => {
              profileMenu.classList.toggle("show");
            });

            window.addEventListener("click", (e) => {
              if (
                !profileBtn.contains(e.target) &&
                !profileMenu.contains(e.target)
              ) {
                profileMenu.classList.remove("show");
              }
            });
          }
localStorage.setItem('userId', '69210713cce3c3420020bbdc');
          const userId = localStorage.getItem("userId");
          if (userId) {
            fetch(`/api/seller/${userId}`)
              .then((res) => res.json())
              .then((data) => {
                document.getElementById("seller-pic").src =
                  data.profilePic ||
                  "../image/user.png";
                document.getElementById("full-name").innerText = data.username;
                document.getElementById("gmail").innerText = data.email;
              })
              .catch((err) => console.error(err));
          }
        })
        .catch((error) =>
          console.error("Erreur lors du chargement du header:", error)
        );
    </script>
