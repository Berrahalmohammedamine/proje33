<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemple de Sidebar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      /* Réinitialisation de base */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #f4f4f4;
      }

      /* --- La barre latérale (Sidebar) --- */
      .sidebar {
        width: 260px;
        background-color: #e8e4f3;
        padding: 25px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
      }

      /* --- Section Profil --- */
      .profile {
        text-align: center;
        margin-bottom: 30px;
        width: 100%;
      }

      .profile-pic {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        margin-bottom: 10px;
      }

      .profile .email {
        font-size: 0.9rem;
        font-weight: 500;
        color: #333;
        margin-bottom: 5px;
      }

      .profile .email i {
        margin-right: 5px;
        color: #7b5aa6;
      }

      .profile .name {
        font-size: 0.8rem;
        color: #666;
      }

      /* --- Boutons de navigation --- */
      .nav-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 15px; /* espace entre les boutons */
      }

      .nav-buttons button {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #7b5aa6;
        color: white;
        width: 100%;
        padding: 50px;
        border: none;
        border-radius: 12px;
        font-size: 1.5rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .nav-buttons button:hover {
        background-color: #6a4c93;
      }

      /* --- Contenu Principal --- */
      .main-content {
        flex-grow: 1;
        padding: 30px;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <div class="profile">
        <img src="../image/6046223645715139534.jpg" class="profile-pic" />
        <p class="email">
          <i class="fa-solid fa-envelope"></i> examexample@gmail.com
        </p>
        <p class="name">Berrahal Mohammed</p>
      </div>

      <div class="nav-buttons">
        <button onclick="location.href='home.html'">
          <i class="fa-solid fa-house"></i>
        </button>
        <button onclick="location.href='teste2.html'">
          <i class="fa-solid fa-clock"></i>
        </button>
        <button onclick="location.href='notifications.html'">
          <i class="fa-solid fa-bell"></i>
        </button>
        <button onclick="location.href='settings.html'">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </nav>

    <main class="main-content">
      <h1>Tableau de bord</h1>
      <p>Bienvenue sur votre page.</p>
    </main>
  </body>
</html>
